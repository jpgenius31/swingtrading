name: Market Scan

# IST = UTC+5:30
# 09:15 IST → 03:45 UTC  9:15 strategy
# 09:18 IST → 03:48 UTC  9:15 refresh
# 09:20 IST → 03:50 UTC  full scan
# 12:30 IST → 07:00 UTC  full + patterns
# 15:00 IST → 09:30 UTC  full scan
# 15:30 IST → 10:00 UTC  patterns
on:
  schedule:
    - cron: "45 3 * * 1-5"
    - cron: "48 3 * * 1-5"
    - cron: "50 3 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      job_type:
        description: "What to run"
        required: true
        default: "full_scan"
        type: choice
        options:
          - full_scan
          - strategy_915
          - patterns_only
          - both
          - all

permissions:
  contents: write

# ONE queue for all scan jobs — prevents two pushes fighting on main
concurrency:
  group: market-scan-main
  cancel-in-progress: false

jobs:
  strategy_915:
    name: 9:15–9:30 open strategy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      (github.event_name == 'schedule' && (github.event.schedule == '45 3 * * 1-5' || github.event.schedule == '48 3 * * 1-5'))
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.job_type == 'strategy_915' || github.event.inputs.job_type == 'both' || github.event.inputs.job_type == 'all'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pandas numpy yfinance requests
      - name: Run 9:15 strategy
        continue-on-error: true
        run: |
          set +e
          python scan_job.py --915 --limit 20 --915-list both
          exit 0
      - name: Ensure output files exist
        run: |
          test -f strategy_915_candle_meta.json || echo '{"rows":0,"ok":false,"source":"workflow-placeholder"}' > strategy_915_candle_meta.json
          test -f strategy_915_candle_live.csv || echo "Stock,Signal,Result" > strategy_915_candle_live.csv

      - name: Commit 9:15 results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add strategy_915_candle_live.csv strategy_915_candle_past.csv strategy_915_candle_meta.json strategy_915_money_summary.json nse_top_gainers_cache.csv nse_top_losers_cache.csv nse_gainers_losers_meta.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No 9:15 changes"
            exit 0
          fi
          git commit -m "chore: 9:15 strategy $(date -u +%Y-%m-%dT%H:%MZ)" || true
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            if git pull --rebase origin main; then
              if git push origin HEAD:main; then
                echo "Push OK (attempt $i)"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((i * 3))
          done
          echo "WARNING: 9:15 push skipped after retries"
          exit 0


  full_scan:
    name: Full market scan
    runs-on: ubuntu-latest
    timeout-minutes: 50
    if: |
      (github.event_name == 'schedule' && (github.event.schedule == '50 3 * * 1-5' || github.event.schedule == '0 7 * * 1-5' || github.event.schedule == '30 9 * * 1-5'))
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.job_type == 'full_scan' || github.event.inputs.job_type == 'both' || github.event.inputs.job_type == 'all' || github.event.inputs.job_type == ''))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pandas numpy yfinance requests
      - name: Verify scan_job.py is fixed (no utcnow)
        run: |
          if grep -n "utcnow" scan_job.py; then
            echo "ERROR: old scan_job.py still has utcnow"
            exit 1
          fi
          echo "OK: no utcnow"
      - name: Run headless scan
        continue-on-error: true
        run: |
          set +e
          python scan_job.py --limit 120
          echo "scan_job exit=$?"
          exit 0
      - name: Show result files
        run: |
          ls -la latest_results.csv latest_results_meta.json 2>/dev/null || true
          head -3 latest_results.csv 2>/dev/null || true

      - name: Commit and push results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          date -u +%Y-%m-%dT%H:%MZ > last_scan_heartbeat.txt
          git add latest_results.csv latest_results_meta.json realtime_sync_version.json strategy_live_signals.csv strategy_live_meta.json index_market_snap.json last_scan_heartbeat.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No scan changes to commit"
            exit 0
          fi
          git commit -m "chore: market scan $(date -u +%Y-%m-%dT%H:%MZ) Mon-Fri IST" || true
          # Race-safe push: pull --rebase then retry (another job may have pushed)
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            if git pull --rebase origin main; then
              if git push origin HEAD:main; then
                echo "Push OK (attempt $i)"
                exit 0
              fi
            else
              echo "Rebase conflict — abort and retry"
              git rebase --abort 2>/dev/null || true
              git merge --abort 2>/dev/null || true
            fi
            echo "Push attempt $i failed — wait and retry"
            sleep $((i * 3))
          done
          echo "WARNING: could not push after retries — data generated but not on remote"
          exit 0


  patterns_auto:
    name: Chart pattern library
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: |
      (github.event_name == 'schedule' && (github.event.schedule == '0 7 * * 1-5' || github.event.schedule == '0 10 * * 1-5'))
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.job_type == 'patterns_only' || github.event.inputs.job_type == 'all'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pandas numpy yfinance requests
      - name: Scan patterns
        continue-on-error: true
        run: |
          set +e
          python scan_job.py --patterns-only --limit 100
          exit 0

      - name: Commit pattern library
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add pattern_scan_results.json pattern_scan_meta.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No pattern changes"
            exit 0
          fi
          git commit -m "chore: pattern library $(date -u +%Y-%m-%dT%H:%MZ)" || true
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            if git pull --rebase origin main; then
              if git push origin HEAD:main; then
                echo "Push OK (attempt $i)"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((i * 3))
          done
          echo "WARNING: pattern push skipped after retries"
          exit 0
