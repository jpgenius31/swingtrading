name: Full Market Scan

# 09:22 IST = 03:52 UTC (after 915 window start)
# 12:30 IST = 07:00 UTC
# 15:00 IST = 09:30 UTC
# 15:35 IST = 10:05 UTC patterns+scan meta
on:
  schedule:
    - cron: "52 3 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "5 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-market-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Headless full scan
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pandas numpy yfinance requests
      - name: Verify no utcnow
        run: |
          if grep -n "utcnow" scan_job.py; then echo "BAD scan_job"; exit 1; fi
          echo "OK"
      - name: Run scan
        continue-on-error: true
        run: |
          set +e
          python scan_job.py --limit 120
          echo "exit=$?"
          exit 0
      - name: Show files
        run: |
          ls -la latest_results.csv latest_results_meta.json 2>/dev/null || true
          head -3 latest_results.csv 2>/dev/null || true
      - name: Commit and push (retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          date -u +%Y-%m-%dT%H:%MZ > last_scan_heartbeat.txt
          git add latest_results.csv latest_results_meta.json realtime_sync_version.json strategy_live_signals.csv strategy_live_meta.json index_market_snap.json last_scan_heartbeat.txt 2>/dev/null || true
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: full scan $(date -u +%Y-%m-%dT%H:%MZ)" || true
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            if git pull --rebase origin main; then
              if git push origin HEAD:main; then echo "Push OK $i"; exit 0; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((i * 4))
          done
          echo "WARNING: push failed"
          exit 0
