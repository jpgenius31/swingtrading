name: Market Scan (manual only)

# Native GitHub cron was unreliable for 9:15 IST (often skipped or hours late).
# Automatic runs moved to:
#   - strategy_915.yml  (9:12 / 9:16 IST)
#   - full_scan.yml     (9:22 / 12:30 / 15:00 / 15:35 IST)
# Use this workflow only for manual "Run workflow" from Actions UI.
on:
  workflow_dispatch:
    inputs:
      job_type:
        description: "What to run"
        required: true
        default: "full_scan"
        type: choice
        options:
          - full_scan
          - strategy_915
          - both

permissions:
  contents: write

concurrency:
  group: market-scan-manual
  cancel-in-progress: false

jobs:
  strategy_915:
    name: 9:15 strategy (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event.inputs.job_type == 'strategy_915' || github.event.inputs.job_type == 'both' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas numpy yfinance requests
      - run: |
          set +e
          python scan_job.py --915 --limit 20 --915-list both
          exit 0
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy_915_candle_live.csv strategy_915_candle_past.csv strategy_915_candle_meta.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: manual 915 $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*3))
          done
          exit 0

  full_scan:
    name: Full scan (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    if: ${{ github.event.inputs.job_type == 'full_scan' || github.event.inputs.job_type == 'both' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas numpy yfinance requests
      - run: |
          set +e
          python scan_job.py --limit 120
          exit 0
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_results.csv latest_results_meta.json realtime_sync_version.json strategy_live_signals.csv strategy_live_meta.json index_market_snap.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: manual full scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*3))
          done
          exit 0
