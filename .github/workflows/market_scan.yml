name: Market Scan

on:
  schedule:
    - cron: "15 4 * * 1-5"
    - cron: "15 10 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install pandas numpy yfinance requests
      - name: Run headless scan
        run: python scan_job.py --limit 120
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_results.csv latest_results_meta.json || true
          if git diff --staged --quiet; then
            echo "No file changes"
          else
            git commit -m "chore: market scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
